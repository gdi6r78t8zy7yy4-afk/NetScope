# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = app/database/migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or datetime.tzinfo dependency.
# Leave unspecified for application-local time.
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the version command to generate a new migration script
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to alembic/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# The path separator used here should be the separator specified by "version_path_separator" below.
version_locations = /app/database/migrations/:%(here)s/app/database/migrations/

# version path separator; As mentioned above, this is the character used to split
# version_locations. The default value in this .ini file is a colon.
# If you want to use colons as part of the path itself, make sure this value is something else.
# version_path_separator = :

# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding of the migration file(s) generated during version generation
# output_encoding = utf-8

sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# post_write hooks can be defined to run after the migration script generation.
# Each hook should point to a Python function that will accept the context as a single argument.

# hooks are defined per line with the format: "name = path.to:callable"
# e.g.:
# reformat = scripts.misc:reformat_script
# hooks =

# defaults to "true"
# render_batch = false


[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[handler_file]
class = FileHandler
args = ('%(here)s/alembic.log', 'a')
level = NOTSET
formatter = generic

[handler_email]
class = logging.handlers.SMTPHandler
args = ('localhost', 'errors@example.com', ['admin@example.com'], 'Alembic Errors')
level = ERROR
formatter = generic

[formatter_generic]
class = logging.Formatter
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[formatter_email]
class = logging.Formatter
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
