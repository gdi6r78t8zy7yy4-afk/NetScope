# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = app/migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or backports.zoneinfo library.
# Any required deps can installed by adding `alembic[tz]` to the pip requirements
# string value is passed to ZoneInfo
# leave blank for 'local' time
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the revision creation, to ensure the script is valid
# render_version_with_tag = false

# import location
# import_path =

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
# prepend_sys_path =

# schema name, for use with multi-schema databases
# schema_name =

# Set to True to use the .ini file's SQLALCHEMY_URL as a fallback
# when environment variable is not set. Default: True
# fallback_to_env = True

# SQLALCHEMY_DATABASE_URI URL to use
sqlalchemy.url = sqlite+aiosqlite:///./netscope.db

# Set to True to use the database URL from environment variable
# environment variable takes precedence over .ini setting
# envvar = SQLALCHEMY_DATABASE_URL

