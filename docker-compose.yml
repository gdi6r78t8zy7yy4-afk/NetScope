# NetScope Docker Compose Configuration

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: netscope-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: netscope
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Backup volume for persistent storage
      - ./backups:/backups:ro
    # NO PORT EXPOSURE FOR DATABASE - use internal network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netscope}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netscope-network

  # Redis (optional, for production cache/session)
  redis:
    image: redis:7-alpine
    container_name: netscope-redis
    # NO PORT EXPOSURE - use internal network only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netscope-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netscope-backend
    volumes:
      - ./backend:/app/backend
      - netscope-data:/app/data
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-netscope}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-netscope}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - API_KEY=${API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}
      - DEBUG=${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app/backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - netscope-network

  # Frontend Web Server
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: netscope-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - netscope-network

volumes:
  postgres_data:
  redis_data:
  netscope-data:

networks:
  netscope-network:
    driver: bridge
