# NetScope Deployment Pipeline

name: Deploy to Production

on:
  push:
    tags:
      - v*

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker compose version
          docker --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --frozen-lockfile --legacy-peer-deps

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build Docker images
        run: |
          docker compose build

      - name: Tag images for registry
        run: |
          # Tag with version and latest
          docker tag netscope-backend:${{ github.sha }} netscope/backend:${{ github.ref_name }}
          docker tag netscope-frontend:${{ github.sha }} netscope/frontend:${{ github.ref_name }}
          docker tag netscope-backend:${{ github.sha }} netscope/backend:latest
          docker tag netscope-frontend:${{ github.sha }} netscope/frontend:latest

      - name: Push images to registry (disabled for safety)
        run: |
          echo "Pushing images would require Docker Hub login"
          echo "Configure AWS ECR or Docker Hub credentials in GitHub Secrets"
          docker images | grep netscope

      - name: Deploy to production (manual trigger)
        run: |
          echo "Production deployment requires manual approval"
          echo "This workflow runs only when tags are pushed (v*)"
          docker compose version
          echo "To deploy: docker compose pull && docker compose up -d"

      - name: Verify deployment
        if: always()
        run: |
          echo "Deployment verification:"
          docker compose ps
          curl -f http://localhost:8000/health || echo "Backend health check skipped"
          curl -f http://localhost:3000/health || echo "Frontend health check skipped"
