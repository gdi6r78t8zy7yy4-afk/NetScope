# Alertmanager Configuration for NetScope

global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST:-localhost:25}'
  smtp_from: '${SMTP_FROM:-alertmanager@netscope.local}'
  smtp_auth_username: '${SMTP_USER:-}'
  smtp_auth_password: '${SMTP_PASSWORD:-}'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s

receivers:
  - name: 'email-notifications'
    email_configs:
      - to: '${ALERT_EMAIL:-alerts@netscope.local}'
        send_resolved: true
        headers:
          subject: '[Alert] {{ .Status | toUpper }}: {{ .CommonAnnotations.summary }}'
          to: '${ALERT_EMAIL:-alerts@netscope.local}'

  - name: 'critical-alerts'
    email_configs:
      - to: '${CRITICAL_EMAIL:-critical@netscope.local}'
        send_resolved: true
        headers:
          subject: '[CRITICAL ALERT] {{ .Status | toUpper }}: {{ .CommonAnnotations.summary }}'
          priority: high
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL:-}'
        send_resolved: true
        channel: '${SLACK_CHANNEL:-#alerts}'
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
